[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtlets"
version = "0.5"
description = "Qt with less boilerplate"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Samuel Palato", email = "spalato@example.com"}
]
maintainers = [
  {name = "Samuel Palato", email = "spalato@example.com"}
]
keywords = ["qt", "qtwidgets", "pyside6", "gui", "mvc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "PySide6>=6.0",
]

[project.urls]
Homepage = "https://github.com/spalato/qtlets"
Repository = "https://github.com/spalato/qtlets"
Documentation = "https://github.com/spalato/qtlets/blob/main/README.md"
Issues = "https://github.com/spalato/qtlets/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["qtlets*"]

[project.optional-dependencies]
dev = ["pytest", "attrs", "traitlets", "build", "twine"]

